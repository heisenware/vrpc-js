name: Website

# vrpc.io renders the repository's docs/ folder, and serves the README as
# /index.md: a change there changes the site. Pull requests build it (a
# broken link or anchor fails the build); master deploys it to GitHub Pages.

on:
  push:
    branches: ["master"]
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - ".github/workflows/deploy-website.yml"
  pull_request:
    paths:
      - "docs/**"
      - "website/**"
      - "README.md"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # the whole history: every page says when it last changed
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: ./website

      - name: Build website
        run: npm run build
        working-directory: ./website

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./website/build"

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # one deployment at a time
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

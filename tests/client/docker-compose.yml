services:

  client:
    image: node:24-alpine
    hostname: client
    container_name: ${TEST_CONT}
    volumes:
      - ../../:/app
      - /var/run/docker.sock:/var/run/docker.sock
    working_dir: /app
    depends_on:
      - broker
      - confined-broker
    command: [
      "tests/client/wait-for.sh",
      "broker:1883",
      "--",
      "node_modules/.bin/mocha",
      "tests/client/*.js",
      "--colors",
      "--exit",
      "--timeout",
      "30000"
    ]

  broker:
    container_name: broker
    image: eclipse-mosquitto:2
    # Mosquitto 2 accepts anonymous clients from other hosts only when told
    command: ["mosquitto", "-c", "/mosquitto-no-auth.conf"]
    hostname: broker
    # ports:
    #   - 1883:1883/tcp

  agent1:
    image: node:24-alpine
    hostname: agent1
    volumes:
      - ../../:/app
    working_dir: /app
    depends_on:
      - broker
    command: [
      "tests/client/wait-for.sh",
      "broker:1883",
      "--",
      "node",
      "tests/client/fixtures/agent.js"
    ]

  agent2:
    image: node:24-alpine
    hostname: agent2
    volumes:
      - ../../:/app
    working_dir: /app
    depends_on:
      - broker
    command: [
      "tests/client/wait-for.sh",
      "broker:1883",
      "--",
      "node",
      "tests/client/fixtures/agent.js"
    ]

  agent3:
    image: node:24-alpine
    hostname: agent3
    volumes:
      - ../../:/app
    working_dir: /app
    depends_on:
      - broker
    command: [
      "tests/client/wait-for.sh",
      "broker:1883",
      "--",
      "node",
      "tests/client/fixtures/agentOnlineOffline.js"
    ]

  # a broker that confines its clients by the protocol's broker policy
  confined-broker:
    container_name: confined-broker
    image: eclipse-mosquitto:2
    command: ["mosquitto", "-c", "/mosquitto/config/mosquitto.conf"]
    hostname: confined-broker
    volumes:
      - ./fixtures/confined/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./fixtures/confined/acl:/mosquitto/config/acl:ro

  confined-agent:
    image: node:24-alpine
    hostname: confined-agent
    volumes:
      - ../../:/app
    working_dir: /app
    depends_on:
      - confined-broker
    command: [
      "tests/client/wait-for.sh",
      "confined-broker:1883",
      "--",
      "node",
      "tests/client/fixtures/confined/agent.js"
    ]

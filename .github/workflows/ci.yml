name: CI

# Every push, and pull requests from forks (a branch of this repository is
# tested by its push already). The in-process suites run on the oldest
# Node.js vrpc supports and on the current LTS lines; the suites that need
# a broker or Docker run once.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Node.js ${{ matrix.node }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run test:adapter
      - run: npm run test:subscriptions
      - run: npm run test:examples
      - run: npm run test:reconnect

  integration-test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    services:
      # Hermetic broker for the suites that accept one: the public HiveMQ
      # broker costs >10 s per connect from the runners and fails at will
      mosquitto:
        image: eclipse-mosquitto:1.6.12
        ports:
          - 1883:1883
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:links
      - run: npm run test:agent
      - run: npm run test:client
      - run: npm run test:persistor
        env:
          VRPC_TEST_BROKER: mqtt://localhost:1883
      - run: npm run test:lifecycle
        env:
          VRPC_TEST_BROKER: mqtt://localhost:1883
      - run: npm run test:legacy-runtime
      - run: npm run test:production
        env:
          VRPC_TEST_BROKER: mqtt://localhost:1883
